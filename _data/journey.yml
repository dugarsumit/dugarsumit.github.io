# Logos for the Journey board on the About page.
# `match` is searched for in the company / university name; `file` lives in /images/orgs/.
# `fit: cover` fills the whole stop (for logos that already have a coloured background).

logos:
  - { match: "Delhi Technological University", file: "dtu.png" }
  - { match: "Snapdeal", file: "snapdeal.png", fit: "cover" }
  - { match: "Lybrate", file: "lybrate.png" }
  - { match: "Technical University of Munich", file: "tum.svg" }
  - { match: "SimScale", file: "simscale.png" }
  - { match: "Kaia", file: "kaia.png" }
  - { match: "e-bot7", file: "ebot7.png" }
  - { match: "Check24", file: "check24.png" }
