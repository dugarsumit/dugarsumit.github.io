# Content of the About page: summary, stats, experience and education.
# This file is the single source of truth; everything on the About page (cards, bento grid,
# timeline, popups) and the education lines in the profile header are generated from it.
#
# Text fields accept Markdown (**bold** is shown as a highlight in popups and the summary).
# `%years%` anywhere in `summary` or `stats` is replaced with `years`.
# Dates are "Mon YYYY" (e.g. "Jul 2023") or "Present".
# Organisation logos come from _data/orgs.yml (matched on `org`).

years: 11

# intro: "Hello! I am a Data Scientist/Machine Learning Engineer/Software Engineer currently working at check24."

summary: >-
  ML and DS professional with **%years% years** of experience building and scaling **ML systems and data platforms**
  using **classical ML and modern DL/AI**. Proven ability to drive technical strategy, system reliability and
  performance, lead teams through complex architectural decisions, and work effectively in globally diverse teams
  across fintech, conversational AI, healthtech and e-commerce domains.

# Tiles shown next to the newest job in the "Career at a glance" grid.
stats:
  - { value: "%years%+", label: "years building ML systems and data platforms" }
  - { value: "9", label: "people hired" }

headings:
  experience: "Professional Experience"
  education: "Education"
  volunteering: "Voluntary Work"
  glance: "Career at a glance"
  glance_hint: "Select any tile to see the full details."

# Small UI labels. `%degree%` becomes e.g. "Master's".
labels:
  education: "Education"
  courses: "Relevant Courses"
  now: "Now"
  relocated: "Relocated"
  newer: "Newer"
  older: "Older"
  student_group: "Working student · part-time alongside the %degree%"
  during: "Part-time during the %degree%"

# Newest first. A `type` containing "student" (e.g. "Working student") marks a part-time working-student role;
# it is shown nested under the degree it overlaps with.
# Use either `groups` (headed bullet lists) or `points` (a flat bullet list).
experience:
  - title: "Lead Data Scientist"
    org: "Check24 Vergleichsportal"
    type: "Full-time"
    from: "Jul 2023"
    to: "Present"
    location: "Munich, Germany"
    domain: "AI Loan Comparison"
    groups:
      - heading: "ML Systems & Business Impact"
        points:
          - "Implemented an MCP server using **FastMCP, Pydantic AI, and LanceDB** to inject company-specific context into AI coding tools, improving the relevance and accuracy of AI-assisted development."
          - "Developed an **NAO**-based data analysis agent that lets non-technical users query and explore the company lakehouse in plain language, **removing the dependency on data teams** for ad-hoc insights."
          - "Implemented a **LightGBM** model for **ranking personalized loan offers**. Boosted **CTR by 1% and sales rate by 0.05%**. Addressed challenges of highly dynamic offer sets and **multi-stage ranking** pipeline to scale to 50k+ offers."
          - "Built a **LightGBM** model with quantile **regression** to predict customer-specific loan approval time, replacing heuristic approach and **achieving 1 day MAE**."
          - "Designed and implemented improvements in model maintainability by automating training and data pipelines with **MLflow**, **Airflow**, and **Kubeflow**, resulting in faster training cycles, and reduced maintenance effort, **allowing the team to focus more on experimentation and innovation**."
      - heading: "Technical Leadership & Ownership Impact"
        points:
          - "Owned the design and evolution of ML systems for personalized loan ranking and prediction of approval probability, interest rates, payout time, and required documents."
          - "Led the design and development of a scalable **data lakehouse platform using DBT, Trino, and Iceberg**, standardizing data and feature pipelines across use cases and **significantly reducing data preparation time**."
          - "Established MLOps best practices across the team, including **model monitoring, A/B testing, and production observability using Prometheus and Grafana**."
          - "Drove adoption of model **explainability, data quality, and drift monitoring (SHAP, Evidently)**, improving transparency and reliability of deployed systems."
          - "Introduced engineering standards and tooling (**CI/CD improvements, SonarQube, pre-commit hooks, testing practices**), improving maintainability and consistency across projects."
      - heading: "Team & Organizational Impact"
        points:
          - "Acted as the data science representative in cross-team technical discussions, **influencing architectural decisions and aligning priorities across teams**."
          - "**Led and mentored a team of 3 data scientists and 2 engineers**, supporting hiring, onboarding, and career development. **Promoted a culture of experimentation and continuous learning.**"

  - title: "Senior Data Scientist / Machine Learning Engineer"
    org: "e-bot7"
    type: "Full-time"
    from: "May 2019"
    to: "Jun 2023"
    location: "Munich, Germany"
    domain: "AI Chat Bots"
    groups:
      - heading: "ML Systems & Business Impact"
        points:
          - "Fine-tuned and trained **transformer-based models (BERT)** for semantic similarity and question answering, **improving sentence similarity performance by 20 percentage points.**"
          - "Introduced multilingual embedding models (DE/EN/FR), **improving performance (+3%) while reducing GPU costs.**"
          - "Reduced embedding dimensionality by 74% using knowledge distillation, **significantly lowering storage and inference costs.**"
      - heading: "Technical Leadership & Ownership Impact"
        points:
          - "Drove key infrastructure decisions around model training and inference, including adoption of **Kubeflow** based pipelines and **AWS services (Glue, Athena, Lambda)** and scalable serving with **Triton Server and gRPC**."
          - "Owned the design and evolution of **semantic search and question answering RAG systems**, driving improvements in both model performance and system architecture."
          - "Led the transition of **embedding** management from **FAISS** to **Elasticsearch**, improving system robustness and operational efficiency."
          - "Led the transition from legacy systems to a modular, event-driven architecture, improving scalability, maintainability, and system flexibility."
      - heading: "Team & Organizational Impact"
        points:
          - "Contributed to **hiring and scaling the engineering team**, including automating parts of the hiring pipeline and interviewing candidates."
          - "**Served as Python Chapter Lead**, mentoring engineers through regular 1:1s and supporting career development and knowledge sharing."

